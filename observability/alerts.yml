# Prometheus alerting rules for AdaptIQ — SLO-driven.
# Load via `rule_files: [alerts.yml]` in prometheus.yml.

groups:
  - name: adaptiq-api
    rules:
      - alert: HighApiErrorRate
        expr: |
          sum(rate(adaptiq_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(adaptiq_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: critical, service: adaptiq }
        annotations:
          summary: "API 5xx error rate above 2%"
          description: "5xx error ratio has exceeded 2% for 10 minutes. Check adaptiq_app_errors_total and correlated api.unhandled_error logs."

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(adaptiq_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning, service: adaptiq }
        annotations:
          summary: "API p95 latency above 1s"
          description: "95th-percentile request latency has exceeded 1s for 10 minutes."

  - name: adaptiq-data
    rules:
      - alert: HighDbLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(adaptiq_db_query_duration_seconds_bucket[5m])) by (le)) > 0.25
        for: 10m
        labels: { severity: warning, service: adaptiq }
        annotations:
          summary: "PostgreSQL p95 query latency above 250ms"
          description: "Database is slow. Inspect db.slow_query logs and adaptiq_db_pool_connections."

      - alert: DbConnectionSaturation
        expr: max(adaptiq_db_pool_connections{state="waiting"}) > 0
        for: 5m
        labels: { severity: warning, service: adaptiq }
        annotations:
          summary: "Requests are waiting on a database connection"
          description: "The pg pool has waiting clients — consider raising pool size or investigating slow queries."

      - alert: DbErrorsPresent
        expr: sum(rate(adaptiq_db_errors_total[5m])) > 0
        for: 5m
        labels: { severity: warning, service: adaptiq }
        annotations:
          summary: "Database queries are failing"
          description: "adaptiq_db_errors_total is increasing."

  - name: adaptiq-ml
    rules:
      - alert: ModelErrorRateHigh
        expr: |
          sum(rate(adaptiq_model_errors_total[15m]))
            / clamp_min(sum(rate(adaptiq_model_predictions_total[15m])), 1e-9) > 0.05
        for: 15m
        labels: { severity: warning, service: adaptiq }
        annotations:
          summary: "Model error rate above 5%"
          description: "Inference/training errors relative to prediction volume are elevated. Check model.error logs."

  - name: adaptiq-fleet
    rules:
      - alert: InstanceDown
        expr: up{job="adaptiq"} == 0
        for: 2m
        labels: { severity: critical, service: adaptiq }
        annotations:
          summary: "AdaptIQ instance is not scrapeable"
          description: "Prometheus cannot scrape {{ $labels.instance }} — the instance may be down or not ready."
