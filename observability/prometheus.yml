# Prometheus scrape configuration for the AdaptIQ platform.
#
# Usage (local):
#   docker run -p 9090:9090 \
#     -v $(pwd)/observability/prometheus.yml:/etc/prometheus/prometheus.yml \
#     -v $(pwd)/observability/alerts.yml:/etc/prometheus/alerts.yml \
#     prom/prometheus
#
# In production, discover replicas via your platform's service discovery
# (kubernetes_sd_configs, ec2_sd_configs, dns_sd_configs, …) instead of the
# static target below. Each replica exposes its own metrics; Prometheus
# aggregates across the `instance` label at query time (pull model).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: adaptiq
    metrics_path: /api/metrics
    scheme: http
    # If METRICS_TOKEN is set on the app, uncomment and supply it here:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/adaptiq-metrics-token
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: adaptiq
          env: local

# Point Prometheus at Alertmanager to actually deliver the alerts in alerts.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # e.g. ["alertmanager:9093"]
